*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--tx);font:15px/1.5 "Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
body::before,body::after{content:"";position:fixed;width:60vmax;height:60vmax;border-radius:50%;filter:blur(90px);z-index:-1;opacity:.75}
body::before{background:var(--b1);top:-25vmax;left:-15vmax}body::after{background:var(--b2);bottom:-30vmax;right:-20vmax}
.gl{background:var(--glass);backdrop-filter:blur(28px) saturate(190%);-webkit-backdrop-filter:blur(28px) saturate(190%);border:1px solid var(--bd);box-shadow:0 8px 32px rgba(0,0,0,.08)}
.wrap{max-width:1100px;margin:0 auto;padding:28px clamp(16px,4vw,40px) 90px}
.hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:26px}

button{font-family:inherit}
.ib{width:44px;height:44px;border-radius:50%;border:0;cursor:pointer;color:var(--tx);font-size:19px;display:grid;place-items:center;transition:transform .4s var(--sp)}
.ib:active,.btn:active{transform:scale(.9)}
input,textarea{font:inherit;color:var(--tx);border:0;outline:0;width:100%;border-radius:14px;transition:box-shadow .25s}
input:focus,textarea:focus{box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 35%,transparent)}
.btn{border:0;border-radius:980px;padding:11px 20px;font-weight:600;cursor:pointer;background:var(--fill);color:var(--tx);transition:transform .35s var(--sp)}
.btn.d{color:#ff453a;margin-top:30px}.btn.d.c{background:#ff453a;color:#fff}
.lk{border:0;background:none;color:var(--ac);font-weight:600;font-size:14px;cursor:pointer;padding:2px 8px}
.fw{animation:fw .55s var(--sp)}.bk{animation:bk .55s var(--sp)}
@keyframes fw{from{opacity:0;transform:translateX(44px) scale(.98)}}@keyframes bk{from{opacity:0;transform:translateX(-44px) scale(.98)}}

.ig{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}

.mos{display:grid;grid-template-columns:repeat(var(--n),1fr)}.mos img{width:100%;aspect-ratio:1;image-rendering:pixelated;display:block}.mos.big{border-radius:28px;overflow:hidden;max-width:560px}
.cv .mos{width:100%;height:100%;grid-auto-rows:1fr}
.bu{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px 14px;background:var(--fill);border-radius:22px;padding:14px 16px}
.bu div{display:flex;align-items:center;gap:10px;font-weight:600}.bu img{width:30px;height:30px;image-rendering:pixelated;border-radius:6px}.bu .lk{margin-left:auto;color:var(--tx2);font-size:18px}

.pt{border:0;background:var(--fill);border-radius:18px;padding:10px 4px 8px;color:var(--tx);font-size:11.5px;font-weight:600;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;transition:transform .35s var(--sp)}
.pt:active{transform:scale(.92)}.pt img{width:44px;height:44px;image-rendering:pixelated;border-radius:8px}.pt span{text-align:center;line-height:1.2}
.pt.on{background:color-mix(in srgb,var(--ac) 22%,transparent);box-shadow:inset 0 0 0 2px var(--ac)}
.mt{color:var(--tx2);padding:10px 0}

#zm::backdrop{background:rgba(0,0,0,.88);backdrop-filter:blur(14px)}

dialog[open]{animation:fw .45s var(--sp)}

.tp{width:70%;text-align:center;font-size:30px}.pb{height:6px;border-radius:9px;background:var(--fill);margin-top:10px;overflow:hidden}.pb i{display:block;height:100%;background:var(--ac);border-radius:9px;transition:width .5s var(--sp)}.pb.big{height:10px;margin:0 0 18px}
.ig.big{grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}.ig.big div{aspect-ratio:4/3}
.tl{display:flex;flex-direction:column;gap:8px}
.tr{display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:20px;background:var(--card);border:1px solid var(--bd);cursor:pointer;font-size:17px;font-weight:600;animation:fw .4s var(--sp);transition:transform .35s var(--sp)}.tr:active{transform:scale(.98)}.tr span{flex:1}
.ck{width:26px;height:26px;border-radius:50%;border:2px solid var(--tx2);flex:none;transition:all .35s var(--sp)}.tr.dn .ck{background:var(--ac);border-color:var(--ac);box-shadow:inset 0 0 0 5px var(--bg)}.tr.dn span{text-decoration:line-through;opacity:.45}

<body>
<div class="wrap">
  <div class="hd"><span class="logo">⛏️ Forever World<span id="ss"></span></span><span class="r"><button class="ib gl" id="so" title="Abmelden" hidden>⎋</button><button class="ib gl" id="sn" title="Sounds">🔊</button></span></div>

</div>
<input id="fi" type="file" accept="image/*" multiple hidden><input id="tf" type="file" accept=".jar,.zip,.png,image/png" multiple hidden><input id="tfd" type="file" webkitdirectory multiple hidden><div id="toast"></div>
<dialog id="imp"><h3>Lokale Daten importieren</h3><p>Füge den Inhalt der Export-Datei (fw-export.json) ein oder wähle die Datei. Bereits vorhandene Einträge werden nicht doppelt angelegt.</p><textarea id="imt" placeholder="JSON hier einfügen …"></textarea><div class="row"><button class="btn pri" id="imc">Importieren</button><button class="btn" onclick="$('imf').click()">Datei wählen</button><button class="btn" id="imx">Abbrechen</button></div><input id="imf" type="file" accept=".json,application/json" hidden></dialog>
<input id="rf" type="file" accept="image/*" hidden><dialog id="rd"><h3 id="rt"></h3><p id="rh"></p>

<dialog id="zm"><button class="ib gl" id="zx">×</button><div class="z" id="zc"><img id="zi" alt="" draggable="false"></div><button class="zb gl zn l" id="zl">‹</button><button class="zb gl zn r" id="zn">›</button><div class="zbar"><button class="zb gl" id="zo">−</button><button class="zb gl" id="zr">1×</button><button class="zb gl" id="zp">+</button></div></dialog>

<script>
const $=s=>document.getElementById(s),esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
let db=null,P=[],PL=[],IL=[],NT=[],st={v:'home'},mute=false,AC=null;
try{mute=localStorage.getItem('fw-mute')==='1'}catch(e){}

/* sanfte Sounds */
function snd(k){if(mute)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const n=AC.currentTime,S={tap:[[660,0,.07]],open:[[523,0,.12],[784,.07,.18]],back:[[784,0,.1],[523,.07,.16]],add:[[587,0,.1],[880,.08,.22]],del:[[247,0,.2],[185,.08,.22]]}[k]||[];
  for(const[f,d,l]of S){const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0,n+d);g.gain.linearRampToValueAtTime(.05,n+d+.015);g.gain.exponentialRampToValueAtTime(.0001,n+d+l);o.connect(g);g.connect(AC.destination);o.start(n+d);o.stop(n+d+l+.05)}}catch(e){}}
$('sn').onclick=()=>{mute=!mute;try{localStorage.setItem('fw-mute',mute?'1':'0')}catch(e){}$('sn').textContent=mute?'🔇':'🔊';snd('tap')};$('sn').textContent=mute?'🔇':'🔊';
document.addEventListener('click',e=>{if(e.target.closest('button,.card,.pt'))snd('tap')});

/* Speicher */
function openDB(){return new Promise(r=>{try{const q=indexedDB.open('fw-projekte',2);q.onupgradeneeded=()=>{const d=q.result;if(!d.objectStoreNames.contains('p'))d.createObjectStore('p',{keyPath:'id'});if(!d.objectStoreNames.contains('tx'))d.createObjectStore('tx',{keyPath:'k'})};q.onsuccess=()=>{db=q.result;db.transaction('p').objectStore('p').getAll().onsuccess=e=>{LOCAL=e.target.result;db.transaction('tx').objectStore('tx').getAll().onsuccess=f=>{f.target.result.forEach(o=>USR[o.k]=o.d);r()}}};q.onerror=()=>r()}catch(e){r()}})}
/* ===== Supabase: gemeinsamer Datenbestand ===== */
const AI_ENABLED=false; /* true = KI-Planer (Next Steps, Stil, Stand) einblenden; braucht Edge Function und API-Key */
const CFG=window.FW_CONFIG||{},BK='inspiration',TB=['projects','palettes','project_palettes','palette_blocks',...(AI_ENABLED?['ideas']:[]),'project_notes','todo_lists','todo_items','images'];
let sb=null,USER=null,online=false,ch=null,wasDown=false,busy=0,Q=Promise.resolve(),LOCAL=[],URLS={},URLS_T=0,D=Object.fromEntries(TB.map(t=>[t,{}]));
const infl={},ipat={},pend=new Map(),nid=()=>(window.crypto&&crypto.randomUUID)?crypto.randomUUID():uid()+uid(),ts=x=>x?Date.parse(x):0;
const errTxt=e=>{const m=(e&&(e.message||e.error_description||e.msg))||String(e);return /Failed to fetch|NetworkError|Load failed/i.test(m)?'keine Verbindung zum Server':m};
function setSt(){const s=$('ss');if(!s)return;if(!USER){s.textContent='';s.className='';return}s.className=!online?'er':busy>0?'sv':'on';s.textContent=!online?'offline':busy>0?'speichert …':'live'}

/* Schreibzugriffe laufen nacheinander, damit Eltern vor Kindern gespeichert werden */
function enq(fn){busy++;setSt();const r=Q.then(fn);Q=r.catch(()=>{}).then(()=>{busy--;setSt()});return r}
function wr(k,fn){infl[k]=(infl[k]||0)+1;return enq(fn).catch(fail).finally(()=>{if(!--infl[k])delete ipat[k]})}
const dirty=k=>pend.has(k)||infl[k]>0;
function fail(e){msg('Speichern fehlgeschlagen: '+errTxt(e));clearTimeout(fail.t);fail.t=setTimeout(()=>loadAll().then(softRender).catch(()=>{}),500)}

/* Datenbank-Zeilen -> bisheriges Datenmodell (P), damit alle Ansichten unverändert bleiben */
const cmp=(a,b)=>ts(a.created_at)-ts(b.created_at)||(a.id<b.id?-1:1);
function rebuild(){const by=(t,k)=>{const m={};for(const r of Object.values(D[t]))(m[r[k]]=m[r[k]]||[]).push(r);for(const k2 in m)m[k2].sort(cmp);return m};
  const pk=by('project_palettes','project_id'),lc=by('project_palettes','palette_id'),bl=by('palette_blocks','palette_id'),tl=by('todo_lists','project_id'),ti=by('todo_items','list_id'),im=by('images','project_id');
  PL=Object.values(D.palettes).sort(cmp).map(q=>({id:q.id,name:q.name,blocks:(bl[q.id]||[]).map(b=>b.name),n:(lc[q.id]||[]).length}));const PQ=Object.fromEntries(PL.map(q=>[q.id,q]));
  NT=Object.values(D.project_notes).sort(cmp).map(n=>({id:n.id,pid:n.project_id,kind:n.kind,title:n.title||'',body:n.body||'',url:n.url||''}));
  IL=Object.values(D.ideas||{}).sort(cmp).map(i=>({id:i.id,pid:i.project_id||'',title:i.title,desc:i.description||''}));
  P=Object.values(D.projects).map(r=>{const ims=(im[r.id]||[]).filter(i=>URLS[i.storage_path]);
    return{id:r.id,name:r.name,notes:r.notes,coords:r.coords,style:r.style||'',progress:r.progress||'',t:ts(r.updated_at),imgs:ims.map(i=>({id:i.id,path:i.storage_path})),insp:ims.map(i=>URLS[i.storage_path]),
      pals:(pk[r.id]||[]).map(l=>PQ[l.palette_id]&&{...PQ[l.palette_id],lid:l.id}).filter(Boolean),
      lists:(tl[r.id]||[]).map(l=>({id:l.id,name:l.name,items:(ti[l.id]||[]).map(x=>({id:x.id,t:x.text,d:x.done}))}))}})}
function dropLocal(t,id){delete D[t][id];
  if(t==='projects'){for(const q of Object.values(D.project_palettes))if(q.project_id===id)delete D.project_palettes[q.id];for(const i of Object.values(D.ideas||{}))if(i.project_id===id)i.project_id=null;for(const n of Object.values(D.project_notes))if(n.project_id===id)delete D.project_notes[n.id];for(const l of Object.values(D.todo_lists))if(l.project_id===id)dropLocal('todo_lists',l.id);for(const i of Object.values(D.images))if(i.project_id===id)dropLocal('images',i.id)}
  else if(t==='palettes'){for(const b of Object.values(D.palette_blocks))if(b.palette_id===id)delete D.palette_blocks[b.id];for(const l of Object.values(D.project_palettes))if(l.palette_id===id)delete D.project_palettes[l.id]}
  else if(t==='todo_lists'){for(const x of Object.values(D.todo_items))if(x.list_id===id)delete D.todo_items[x.id]}}

/* Bilder: privater Bucket, Anzeige über zeitlich begrenzte Links */
async function ensureUrls(paths){const m=[...new Set(paths)].filter(p=>p&&!URLS[p]);if(!m.length)return;const{data,error}=await sb.storage.from(BK).createSignedUrls(m,43200);if(error)throw error;(data||[]).forEach(x=>{if(x.signedUrl)URLS[x.path]=x.signedUrl});URLS_T=Date.now()}
const allPaths=()=>Object.values(D.images).map(i=>i.storage_path);
async function refreshUrls(){URLS={};await ensureUrls(allPaths());rebuild();softRender()}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&USER&&URLS_T&&Date.now()-URLS_T>6*36e5)refreshUrls().catch(()=>{})});

/* Laden */
async function fetchAll(t){const out=[];for(let i=0;;i+=1000){const{data,error}=await sb.from(t).select('*').order('created_at').order('id').range(i,i+999);if(error)throw error;out.push(...data);if(data.length<1000)break}return out}
async function loadAll(){let res;try{res=await Promise.all(TB.map(fetchAll))}catch(e){if(/schema cache|does not exist|42P01|PGRST205/i.test((e&&(e.message+e.code))||''))throw new Error('Die Datenbank ist noch nicht auf dem neuesten Stand. Bitte die SQL-Migrationen 0002 bis 0004 in Supabase ausführen.');throw e}const nd={};TB.forEach((t,i)=>{nd[t]={};res[i].forEach(r=>{nd[t][r.id]=r})});D=nd;
  try{await ensureUrls(allPaths())}catch(e){msg('Bilder konnten nicht geladen werden: '+errTxt(e))}rebuild()}

/* Änderungen: erst lokal (sofort sichtbar), dann in die Datenbank */
function dbIns(t,row){row.created_at=new Date().toISOString();D[t][row.id]={...row,updated_at:row.created_at};rebuild();
  wr(t+':'+row.id,async()=>{const{data,error}=await sb.from(t).insert(row).select().maybeSingle();if(error)throw error;const l=D[t][row.id];if(l&&data&&data.updated_at)l.updated_at=data.updated_at})}
function dbUpd(t,id,patch,delay){const r=D[t][id];if(!r)return;Object.assign(r,patch);rebuild();const k=t+':'+id,o=pend.get(k)||{patch:{}};Object.assign(o.patch,patch);clearTimeout(o.timer);pend.set(k,o);
  o.timer=setTimeout(()=>{pend.delete(k);const pt=o.patch;ipat[k]=Object.assign(ipat[k]||{},pt);wr(k,async()=>{const{data,error}=await sb.from(t).update(pt).eq('id',id).select().maybeSingle();if(error)throw error;const l=D[t][id];if(l&&data&&!pend.has(k))l.updated_at=data.updated_at})},delay===undefined?350:delay)}
function dbDel(t,id){const k=t+':'+id,o=pend.get(k);if(o){clearTimeout(o.timer);pend.delete(k)}
  const paths=t==='projects'?Object.values(D.images).filter(i=>i.project_id===id).map(i=>i.storage_path):(t==='images'&&D.images[id]?[D.images[id].storage_path]:[]);
  dropLocal(t,id);rebuild();
  wr(k,async()=>{const{error}=await sb.from(t).delete().eq('id',id);if(error)throw error;if(paths.length)await sb.storage.from(BK).remove(paths)})}
function addBlock(pid,name){if(Object.values(D.palette_blocks).some(b=>b.palette_id===pid&&b.name===name))return;dbIns('palette_blocks',{id:nid(),palette_id:pid,name})}
function delBlock(pid,name){const b=Object.values(D.palette_blocks).find(x=>x.palette_id===pid&&x.name===name);if(b)dbDel('palette_blocks',b.id)}
async function putImg(pid,du){const id=nid(),path=pid+'/'+id+'.jpg',blob=await(await fetch(du)).blob(),row={id,project_id:pid,storage_path:path,created_at:new Date().toISOString()},k='images:'+id;
  URLS[path]=du;D.images[id]=row;rebuild();softRender();infl[k]=1;
  try{await enq(async()=>{const u=await sb.storage.from(BK).upload(path,blob,{contentType:'image/jpeg',cacheControl:'3600',upsert:false});if(u.error)throw u.error;
      const r=await sb.from('images').insert(row);if(r.error){await sb.storage.from(BK).remove([path]);throw r.error}})}
  catch(e){dropLocal('images',id);rebuild();softRender();throw e}finally{infl[k]=0}}
const rmImg=(p,i)=>{const m=p.imgs[i];if(m)dbDel('images',m.id)};

/* Echtzeit: Änderungen anderer Geräte übernehmen */
function onRT(pl){const t=pl.table,n=pl.new,o=pl.old;if(!D[t])return;
  if(pl.eventType==='DELETE'){const id=o&&o.id;if(id&&D[t][id]){dropLocal(t,id);rebuild();sched()}return}
  if(!n||!n.id)return;const k=t+':'+n.id,c=D[t][n.id];
  if(c){if(dirty(k)){const mine={...(ipat[k]||{}),...((pend.get(k)||{}).patch||{})};if(!Object.keys(mine).length)return;for(const f in n)if(!(f in mine)&&f!=='updated_at')c[f]=n[f];rebuild();sched();return}if(ts(n.updated_at)<ts(c.updated_at))return}
  D[t][n.id]=n;
  if(t==='images'){ensureUrls([n.storage_path]).catch(()=>{}).then(()=>{rebuild();sched()});return}
  rebuild();sched()}
function subscribe(){if(ch)sb.removeChannel(ch);ch=sb.channel('fw-sync');TB.forEach(t=>ch.on('postgres_changes',{event:'*',schema:'public',table:t},onRT));
  ch.subscribe(s=>{if(s==='SUBSCRIBED'){online=true;setSt();if(wasDown){wasDown=false;loadAll().then(softRender).catch(()=>{})}}else if(s==='CHANNEL_ERROR'||s==='TIMED_OUT'||s==='CLOSED'){online=false;wasDown=true;setSt()}})}
let rq=0;const sched=()=>{if(rq)return;rq=requestAnimationFrame(()=>{rq=0;softRender()})};
function softRender(){if(!['home','pals','ideas','proj','pal','insp','todo'].includes(st.v))return;const a=document.activeElement,id=a&&a.id&&$('v').contains(a)?a.id:null,sel=id?[a.selectionStart,a.selectionEnd]:null,val=id?a.value:'',y=scrollY;
  render(0);scrollTo(0,y);if(id){const n=$(id);if(n){if(id==='qb'||id==='tn'){n.value=val;if(id==='qb')$('pg').innerHTML=tiles(val)}n.focus({preventScroll:true});try{n.setSelectionRange(sel[0],sel[1])}catch(e){}}}}

/* Anmeldung */
const tmo=(p,ms)=>Promise.race([p,new Promise((_,r)=>setTimeout(()=>r(new Error('Zeitüberschreitung')),ms))]);
const canStore=()=>{try{localStorage.setItem('fw-t','1');localStorage.removeItem('fw-t');return true}catch(e){return false}};
const lastEmail=()=>{try{return localStorage.getItem('fw-email')||''}catch(e){return ''}};
const sessionSaved=()=>{try{for(let i=0;i<localStorage.length;i++)if(/^sb-.*-auth-token$/.test(localStorage.key(i)))return true}catch(e){}return false};
addEventListener('online',()=>{if(st.v==='err')boot()});
async function boot(){
  if(!CFG.url||!CFG.key||!window.supabase){st={v:'cfg'};render();return}
  if(!sb){sb=window.supabase.createClient(CFG.url,CFG.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
    sb.auth.onAuthStateChange(ev=>{if(ev==='SIGNED_OUT'&&USER)leave('Sitzung abgelaufen. Bitte neu anmelden.')})}
  st={v:'load'};render();
  let r;try{r=await tmo(sb.auth.getSession(),10000)}catch(e){st={v:'err',msg:'Die Anmeldung wurde nicht rechtzeitig geprüft. Deine Anmeldung bleibt gespeichert.'};render();return}
  if(r.error){st={v:'err',msg:errTxt(r.error)+'. Deine Anmeldung bleibt gespeichert.'};render();return}
  if(!r.data.session){st={v:'auth'};render();return}
  await enter(r.data.session.user)}
async function enter(user){USER=user;$('so').hidden=false;st={v:'load'};render();
  let m;try{m=await tmo(sb.rpc('is_member'),12000)}catch(e){st={v:'err',msg:'Der Server antwortet nicht. Prüfe deine Verbindung.'};render();return}
  if(m.error){if(m.status===401||/jwt|token/i.test(m.error.message||'')){const s=sb;leave('Deine Sitzung ist abgelaufen. Bitte neu anmelden.');s.auth.signOut({scope:'local'}).catch(()=>{});return}
    st={v:'err',msg:errTxt(m.error)};render();return}
  if(m.data!==true){st={v:'deny'};render();return}
  try{await tmo(loadAll(),45000)}catch(e){st={v:'err',msg:errTxt(e)};render();return}
  subscribe();setSt();st={v:'home'};render(1)}
function leave(m){USER=null;online=false;if(ch&&sb)sb.removeChannel(ch);ch=null;D=Object.fromEntries(TB.map(t=>[t,{}]));URLS={};P=[];PL=[];IL=[];NT=[];PLN={};pend.forEach(o=>clearTimeout(o.timer));pend.clear();$('so').hidden=true;setSt();st={v:'auth',msg:m};render(1)}
async function login(){const e=$('au_e').value.trim(),p=$('au_p').value,m=$('au_m'),b=$('au_b');
  if(!e||!p){m.textContent='Bitte E-Mail und Passwort eingeben.';return}
  b.disabled=true;m.textContent='Anmelden …';
  let r;try{r=await tmo(sb.auth.signInWithPassword({email:e,password:p}),15000)}catch(x){b.disabled=false;m.textContent='Anmeldung fehlgeschlagen: keine Antwort vom Server.';return}
  const{data,error}=r;
  if(error){b.disabled=false;m.textContent=/invalid login/i.test(error.message)?'E-Mail oder Passwort stimmt nicht.':'Anmeldung fehlgeschlagen: '+errTxt(error);return}
  try{localStorage.setItem('fw-email',e)}catch(x){}
  await enter(data.user);
  if(USER&&canStore()&&!sessionSaved())msg('Hinweis: Die Anmeldung konnte auf diesem Gerät nicht gespeichert werden. Beim nächsten Öffnen musst du dich neu anmelden.')}
/* Abmelden gilt nur für dieses Gerät, andere Geräte bleiben angemeldet */
$('so').onclick=async()=>{const s=sb;leave();try{await s.auth.signOut({scope:'local'})}catch(e){}};

/* Ansichten für Anmeldung und Status */
const msgV=(t,s)=>`<h1>${esc(t)}<small>${esc(s||'')}</small></h1>`;
const authV=m=>`<h1>Anmelden<small>Forever World ist privat. Nur freigegebene Konten haben Zugriff.</small></h1><form class="auth" id="au_f"><input class="ti s" id="au_e" name="email" type="email" placeholder="E-Mail" value="${esc(lastEmail())}" autocomplete="username" autocapitalize="off" spellcheck="false"><input class="ti s" id="au_p" name="password" type="password" placeholder="Passwort" autocomplete="current-password"><button class="btn pri" id="au_b" type="submit">Anmelden</button><div class="mt" id="au_m">${esc(m||'')}</div>${canStore()?'':'<div class="mt">Dein Browser blockiert das Speichern von Website-Daten (privates Fenster oder strenger Datenschutz). Du musst dich dann bei jedem Öffnen neu anmelden.</div>'}</form>`;
const denyV=()=>msgV('Kein Zugriff','Das Konto '+(USER&&USER.email||'')+' ist nicht freigegeben. Die E-Mail muss in der Tabelle allowed_emails stehen.')+`<button class="btn" data-op="lo">Abmelden</button>`;
const errV=()=>msgV('Verbindung fehlgeschlagen',st.msg)+`<button class="btn" data-op="rt">Erneut versuchen</button> <button class="btn" data-op="lo">Neu anmelden</button>`;
const cfgV=()=>msgV('Einrichtung fehlt','config.js enthält keine Supabase-Werte, oder die Supabase-Bibliothek konnte nicht geladen werden.');

/* Lokale Daten aus diesem Browser oder einer Export-Datei in die gemeinsame Datenbank übernehmen */
const migKey=()=>'fw-migrated-'+(USER&&USER.id),migrated=()=>{try{return localStorage.getItem(migKey())==='1'}catch(e){return false}};
async function up(t,rows){for(let i=0;i<rows.length;i+=200){const{error}=await sb.from(t).upsert(rows.slice(i,i+200),{onConflict:'id',ignoreDuplicates:true});if(error)throw error}}
async function migrate(list){const own=!list;list=list||LOCAL;if(!USER||!list.length)return;msg('Übernehme '+list.length+' Projekte …');
  const nm=s=>String(s==null?'':s),PR=[],PA=[],PP=[],BL=[],TL=[],TI=[],IM=[],UP=[];let c=Date.now();const at=()=>new Date(c++).toISOString(),seenI=new Set();

  else if(op==='nbk'){NP.open=!NP.open;NP.pid=st.p;NP.force=1;npSync();NP.force=0}
  else if(op==='pp'){PK=p.id;pkDraw();$('pk').showModal()}
  else if(op==='op'){snd('open');go('pal',p.id,d.q,1)}
  else if(op==='tg'){const c=cq(),i=c.blocks.indexOf(d.n);i>=0?delBlock(c.id,d.n):addBlock(c.id,d.n);snd(i>=0?'tap':'add');keep()}
  else if(op==='rb'){const c=cq();delBlock(c.id,c.blocks[+d.i]);snd('del');keep()}
  else if(op==='dq'||op==='dp'||op==='dl'){if(!d.arm){b.dataset.arm=1;b.textContent='Wirklich löschen?';b.classList.add('c');setTimeout(()=>{b.dataset.arm='';b.textContent=op==='dp'?'Projekt löschen':op==='dq'?'Palette löschen':'Liste löschen';b.classList.remove('c')},3000);return}
    snd('del');if(op==='dl'){dbDel('todo_lists',st.q);go('proj',p.id,null,-1)}else if(op==='dq'){dbDel('palettes',st.q);st.from==='pals'?go('pals',null,null,-1):go('proj',p.id,null,-1)}else{dbDel('projects',p.id);go('home',null,null,-1)}}});
$('v').addEventListener('input',e=>{const p=P.find(x=>x.id===st.p),id=e.target.id,v=e.target.value;
  if(id==='pn')dbUpd('projects',p.id,{name:v});else if(id==='pt')dbUpd('projects',p.id,{notes:v});else if(id==='pc')dbUpd('projects',p.id,{coords:v});else if(id==='psy')dbUpd('projects',p.id,{style:v.slice(0,200)});else if(id==='ppr')dbUpd('projects',p.id,{progress:v.slice(0,500)});else if(id==='pci'){pls(p.id).draft=v}else if(id==='ina')IDR=v;
  else if(id==='ln')dbUpd('todo_lists',st.q,{name:v});else if(id==='qn')dbUpd('palettes',st.q,{name:v});else if(id==='qb')$('pg').innerHTML=tiles(v)});
$('v').addEventListener('change',e=>{const id=e.target.dataset&&e.target.dataset.ip;if(id)dbUpd('ideas',id,{project_id:e.target.value||null},0)});
$('v').addEventListener('keydown',e=>{if(e.key!=='Enter')return;if(e.target.id==='pci'){e.preventDefault();const p=P.find(x=>x.id===st.p);if(p)plnSend(p)}else if(e.target.id==='ina'){e.preventDefault();addIdea()}});
$('v').addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='au_f')login()});
$('v').addEventListener('keydown',e=>{if(e.target.id==='au_e'&&e.key==='Enter'&&!$('au_p').value){e.preventDefault();$('au_p').focus();return}
  if(e.target.id==='tn'&&e.key==='Enter'){const v=e.target.value.trim();if(!v)return;dbIns('todo_items',{id:nid(),list_id:st.q,text:v.slice(0,500),done:false});snd('add');keep();$('tn').focus();return}
  if(e.target.id==='qb'&&e.key==='Enter'){const v=e.target.value.trim(),c=cq();if(!v)return;const f=findB(v.toLowerCase()),name=(f?f.n[0]:v).slice(0,80);if(!c.blocks.includes(name)){addBlock(c.id,name);snd('add')}keep();$('qb').focus()}});
$('zx').onclick=()=>$('zm').close();
/* Zoom: Mausrad, Pinch, Ziehen, Doppelklick, Buttons, Pfeile */
let Z={s:1,x:0,y:0,i:0},zpt=new Map(),zpd=0,zmv=0;
const zap=()=>{$('zi').style.transform=`translate(${Z.x}px,${Z.y}px) scale(${Z.s})`;$('zr').textContent=(Math.round(Z.s*10)/10)+'×'};
function zset(i){const p=cp();if(!p)return;Z.i=Math.max(0,Math.min(p.insp.length-1,i));$('zi').src=p.insp[Z.i];Z.s=1;Z.x=Z.y=0;zap();$('zl').hidden=Z.i<=0;$('zn').hidden=Z.i>=p.insp.length-1}
function zs(n,px,py){n=Math.max(1,Math.min(10,n));const r=$('zc').getBoundingClientRect(),cx=(px===undefined?r.left+r.width/2:px)-r.left-r.width/2,cy=(py===undefined?r.top+r.height/2:py)-r.top-r.height/2,k=n/Z.s;Z.x=cx-(cx-Z.x)*k;Z.y=cy-(cy-Z.y)*k;Z.s=n;if(n===1){Z.x=0;Z.y=0}zap()}
const zpa=()=>[...zpt.values()],zdist=()=>{const a=zpa();return Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1])||1};
$('zc').onwheel=e=>{e.preventDefault();zs(Z.s*(e.deltaY<0?1.2:1/1.2),e.clientX,e.clientY)};
$('zc').ondblclick=e=>zs(Z.s>1.05?1:3,e.clientX,e.clientY);
$('zc').onpointerdown=e=>{zpt.set(e.pointerId,[e.clientX,e.clientY]);$('zc').setPointerCapture(e.pointerId);$('zi').classList.add('dg');zpd=zpt.size===2?zdist():0;zmv=0};
$('zc').onpointermove=e=>{if(!zpt.has(e.pointerId))return;const o=zpt.get(e.pointerId);zpt.set(e.pointerId,[e.clientX,e.clientY]);zmv+=Math.abs(e.clientX-o[0])+Math.abs(e.clientY-o[1]);
  if(zpt.size===2){const d=zdist(),a=zpa();if(zpd)zs(Z.s*d/zpd,(a[0][0]+a[1][0])/2,(a[0][1]+a[1][1])/2);zpd=d}else if(Z.s>1){Z.x+=e.clientX-o[0];Z.y+=e.clientY-o[1];zap()}};
$('zc').onpointerup=$('zc').onpointercancel=e=>{if(e.type==='pointerup'&&zmv<6&&zpt.size===1&&!e.target.closest('img'))$('zm').close();zpt.delete(e.pointerId);zpd=0;if(!zpt.size)$('zi').classList.remove('dg')};
$('zp').onclick=()=>zs(Z.s*1.5);$('zo').onclick=()=>zs(Z.s/1.5);$('zr').onclick=()=>zs(1);
$('zl').onclick=()=>zset(Z.i-1);$('zn').onclick=()=>zset(Z.i+1);
addEventListener('keydown',e=>{if(!$('zm').open)return;if(e.key==='+'||e.key==='=')zs(Z.s*1.5);else if(e.key==='-')zs(Z.s/1.5);else if(e.key==='0')zs(1);else if(e.key==='ArrowLeft'&&!$('zl').hidden)zset(Z.i-1);else if(e.key==='ArrowRight'&&!$('zn').hidden)zset(Z.i+1)});
addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('zm').open&&!$('imp').open&&['proj','pal','insp','todo'].includes(st.v)){snd('back');st.v==='proj'?go('home',null,null,-1):go('proj',st.p,null,-1)}});
const msg=t=>{const e=$('toast');e.textContent=t;e.classList.add('s');clearTimeout(msg.t);msg.t=setTimeout(()=>e.classList.remove('s'),2200)};
async function impTex(files){let n=0;for(const f of files){if(!/\.png$/i.test(f.name))continue;try{const b=await createImageBitmap(f),w=b.width,sz=Math.min(w,64),c=document.createElement('canvas');c.width=c.height=sz;const x=c.getContext('2d');x.imageSmoothingEnabled=false;x.drawImage(b,0,0,w,w,0,0,sz,sz);const k=f.name.replace(/\.png$/i,'').toLowerCase(),d=c.toDataURL();USR[k]=d;try{db.transaction('tx','readwrite').objectStore('tx').put({k,d})}catch(e){}n++}catch(e){}}
  Object.keys(TC).forEach(k=>delete TC[k]);snd('add');msg(n+' Texturen geladen');if(st.v==='pal')keep()}
async function impJar(f){msg('Lade …');try{const z=await JSZip.loadAsync(f),pre='assets/minecraft/textures/block/',l=[];for(const q in z.files){if(q.startsWith(pre)&&q.endsWith('.png')&&!q.slice(pre.length).includes('/'))l.push(new File([await z.files[q].async('blob')],q.slice(pre.length),{type:'image/png'}))}l.length?await impTex(l):msg('Keine Block-Texturen gefunden')}catch(e){msg('Fehler beim Lesen der Datei')}}
$('tf').onchange=$('tfd').onchange=async e=>{const fs=[...e.target.files];e.target.value='';const j=fs.filter(f=>/\.(jar|zip)$/i.test(f.name));for(const x of j)await impJar(x);const pn=fs.filter(f=>!j.includes(f));if(pn.length)impTex(pn)};
openDB().then(boot);
